name: NeuroClass CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Type check
        working-directory: backend
        run: npm run typecheck
      - name: Unit tests
        working-directory: backend
        run: npm test
      - name: Prepare test database (schema + all migrations)
        working-directory: backend
        run: TEST_DATABASE_ADMIN_URL=postgresql://postgres:postgres@localhost:5432/postgres ./tests/integration/prepare-db.sh
      - name: Integration tests (authorization, lifecycle, IDOR negatives)
        working-directory: backend
        run: TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/neuroclass_test npm run test:integration
      - name: Production build
        working-directory: backend
        run: npm run build

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt httpx
      - name: Tests
        run: ML_SERVICE_API_KEY=ci-test-key python -m pytest -q
      - name: Behaviour evaluation (synthetic sequences)
        run: PYTHONPATH=. ML_SERVICE_API_KEY=ci-test-key python scripts/evaluate.py
